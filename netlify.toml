[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NOTE: do NOT set NODE_ENV=production here — it makes `npm install` skip
  # devDependencies (tailwindcss, typescript, postcss …) which the Next.js
  # build needs. `next build` runs in production mode on its own anyway.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  # Only include Next.js server artifacts, NOT node_modules (Netlify installs those automatically)
  included_files = [
    ".next/server/**",
    ".next/required-server-files.json",
    "package.json"
  ]
